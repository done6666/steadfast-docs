id: ADR-0019
topic: session-start
scope: global
status: active
created: 2026-10-30
applies_to:
  - src/commands/hook.ts
  - test/hook.test.ts
decision: hook install --platform claude adds a SessionStart hook that runs brief; platforms without a session-start context hook are refused.
why:
  - Memory the agent must pull gets skipped; a harness hook pushes it into every new, resumed or compacted session.
rejected:
  - "OpenCode compaction plugin: experimental API and it fires only on compaction, not at session start."
enforced_by: test/hook.test.ts
by: agent
