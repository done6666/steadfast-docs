name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - if: github.event_name == 'pull_request'
        run: node dist/src/cli.js check --strict --diff origin/${{ github.base_ref }}
      - if: github.event_name != 'pull_request'
        run: node dist/src/cli.js check --strict
